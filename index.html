<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V7 Digital Studio</title>
<meta name="description" content="Design e tecnologia direto ao ponto. Fale com a V7 no WhatsApp ou Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#9900FF;
    --black:#0D0D0D;
    --white:#FFFFFF;
    --gray:#8A8A8A;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
  }

  body{
    background:var(--black);
    color:var(--white);
    font-family:'Manrope', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    min-height:100vh;
    padding: 6vh 8vw;
    text-align:center;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }

  .glow{
    position:absolute;
    inset:-20%;
    z-index:-1;
    background:
      radial-gradient(38vh 38vh at 50% 28%, rgba(153,0,255,0.32), transparent 70%),
      radial-gradient(30vh 30vh at 78% 78%, rgba(153,0,255,0.16), transparent 70%),
      radial-gradient(30vh 30vh at 18% 82%, rgba(153,0,255,0.14), transparent 70%);
    filter:blur(4px);
    animation: drift 12s ease-in-out infinite alternate;
  }

  @keyframes drift{
    0%{ transform: translate(-2%, -2%) scale(1); }
    100%{ transform: translate(2%, 3%) scale(1.08); }
  }

  .mark{
    position:relative;
    width:clamp(150px, 42vw, 210px);
    filter:drop-shadow(0 0 26px rgba(153,0,255,0.35));
    animation: markIn 1s cubic-bezier(.2,.8,.2,1) both, float 5s ease-in-out 1s infinite;
  }

  .mark img{
    display:block;
    width:100%;
    height:auto;
  }

  @keyframes markIn{
    0%{ opacity:0; transform:scale(.7) rotate(-8deg); filter:drop-shadow(0 0 0 rgba(153,0,255,0)); }
    60%{ opacity:1; transform:scale(1.05) rotate(2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 26px rgba(153,0,255,0.35)); }
  }

  @keyframes float{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .eyebrow{
    margin-top:22px;
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:600;
  }

  h1{
    margin-top:28px;
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:clamp(1.02rem, 4.2vw, 1.32rem);
    line-height:1.4;
    max-width:22ch;
    color:var(--white);
    text-transform:uppercase;
    letter-spacing:0.01em;
  }

  h1 span{ color:var(--purple); }

  .actions{
    margin-top:44px;
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:360px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    font-family:'Manrope', sans-serif;
    font-weight:600;
    font-size:0.98rem;
    text-decoration:none;
    transition:transform .15s ease, opacity .15s ease;
  }

  .btn:active{ transform:scale(0.97); }

  .btn-primary{
    background:var(--purple);
    color:var(--white);
    box-shadow:0 0 0 0 rgba(153,0,255,0.55);
    animation: pulse 2.6s ease-out infinite;
  }

  .btn-secondary{
    background:transparent;
    color:var(--white);
    border:1px solid rgba(255,255,255,0.22);
  }

  .btn:hover{ opacity:0.92; }

  .btn svg{ width:19px; height:19px; flex-shrink:0; }

  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(153,0,255,0.45); }
    70%{ box-shadow:0 0 0 14px rgba(153,0,255,0); }
    100%{ box-shadow:0 0 0 0 rgba(153,0,255,0); }
  }

  .tags{
    margin-top:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    font-size:0.72rem;
    color:var(--gray);
    letter-spacing:0.02em;
  }

  .tags span:not(.dot){ white-space:nowrap; }

  .dot{
    width:3px; height:3px;
    border-radius:50%;
    background:var(--gray);
    display:inline-block;
  }

  footer{
    position:absolute;
    bottom:22px;
    font-size:0.68rem;
    letter-spacing:0.06em;
    color:#4a4a4a;
  }

  @media (prefers-reduced-motion: no-preference){
    .mark, .eyebrow, h1, .actions{
      animation: rise .6s ease both;
    }
    .eyebrow{ animation-delay:.08s; }
    h1{ animation-delay:.14s; }
    .actions{ animation-delay:.22s; }
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--purple);
    outline-offset:3px;
  }

  #nodes{
    position:absolute;
    inset:0;
    z-index:-1;
    width:100%;
    height:100%;
    opacity:0.55;
  }
</style>
</head>

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('nodes');
  if (!canvas || reduceMotion) return;
  var ctx = canvas.getContext('2d');
  var w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var points = [];
  var COUNT = 22;
  var LINK_DIST = 130;

  function resize(){
    w = canvas.clientWidth = window.innerWidth;
    h = canvas.clientHeight = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function init(){
    points = [];
    for (var i=0; i<COUNT; i++){
      points.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: (Math.random()-0.5)*0.18,
        vy: (Math.random()-0.5)*0.18,
        r: Math.random()*1.6 + 1,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  function step(){
    ctx.clearRect(0,0,w,h);
    for (var i=0; i<points.length; i++){
      var p = points[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    for (var i=0; i<points.length; i++){
      for (var j=i+1; j<points.length; j++){
        var a = points[i], b = points[j];
        var dx = a.x-b.x, dy = a.y-b.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < LINK_DIST){
          ctx.strokeStyle = 'rgba(153,0,255,' + (0.16 * (1 - dist/LINK_DIST)) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    for (var i=0; i<points.length; i++){
      var p = points[i];
      var pulse = Math.sin(Date.now()*0.003 + p.phase);
      var rr = p.r * (1 + pulse*0.9);
      ctx.fillStyle = 'rgba(153,0,255,' + (0.4 + pulse*0.4) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(rr, 0.4), 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(step);
  }

  window.addEventListener('resize', function(){ resize(); init(); });
  resize();
  init();
  requestAnimationFrame(step);
})();
</script>
